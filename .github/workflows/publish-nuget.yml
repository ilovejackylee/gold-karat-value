name: Publish NuGet package

on:
  push:
    branches: [main]
    paths:
      - "dotnet/**"
      - ".github/workflows/publish-nuget.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Pack
        working-directory: dotnet/GoldKaratValue
        run: dotnet pack GoldKaratValue.csproj -c Release -o ./nupkgs --nologo

      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: hiltonlee981

      - name: Push
        working-directory: dotnet/GoldKaratValue
        run: >
          dotnet nuget push ./nupkgs/*.nupkg
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
