name: Publish Docker image

on:
  push:
    branches: [main]
    paths:
      - "docker/**"
      - ".github/workflows/publish-docker.yml"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test
        working-directory: docker/gold-karat-value
        run: python3 -m unittest test_gold_karat_value.py -v

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ./docker/gold-karat-value
          push: true
          tags: |
            hiltonlee981/gold-karat-value:0.1.0
            hiltonlee981/gold-karat-value:latest

      - name: Update Hub description
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: hiltonlee981/gold-karat-value
          short-description: Estimate gold melt and scrap value from karat, weight, and a 24K price per gram.
          readme-filepath: docker/gold-karat-value/README.md
